<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {background-color:#555555;}
    input {

    tbody tr:nth-child(odd) {
        background-color: #444444;

    #listDiv {
        border : 1px solid #444444;
        position : fixed;
        /*width : 96%;*/
        width : 575px;
        min-width:575px;
        background-color: #333333;
        color: #888888;
        height:43px;
    }
    #pageDiv {
        border : 1px solid #454545;
        padding: 0 5px 0 5px;
        background-color: #181818;
        color: #777777;
        min-width:575px;
    }

    @media (max-width: 375px) {
        html {
            font-size:14pt;
        }
    }
    pre {
        /**/font-size: 12pt;/**/
        /*font-family:monospace;*/
        margin:0;
    }

        color:#3da126;
    }

  </style>
  <script src="kssmcode.js?v=<?=filemtime('kssmcode.js')?>"></script>
  <script src="iss.js?v=<?=filemtime('iss.js')?>"></script>
  <script src="lib.js?v=<?=filemtime('lib.js')?>"></script>
  <script>
    var params = URLSearchParams && new URLSearchParams(document.location.search.substring(1));
    var url = params && params.get("url") && decodeURIComponent(params.get("url"));

    var iss;
    var issView;
    var file;
    var isRun = false;

    var tick=0;
    var t_delay = 2;
    function TimeOut(){
        tick+=t_delay;
        var _curRec = iss.play(tick);
        //console.log(_curRec);
        document.querySelectorAll('#btnDiv > button')[1]
                    .innerHTML = JSON.stringify( _curRec );

        if(_curRec=='END'){
            console.log('END');
            doStart();
            isRun=false;
            return;
        }

        if(!isRun) return;
        else {
            //var time = t_delay;
            tick+=t_delay;
            setTimeout(TimeOut, 20);
        }
    }

    function doRun(){
        if(isRun){
            document.querySelectorAll('#btnDiv > button')[1].innerHTML = 'ViewLyric';
            isRun = false;
        } else {
//            document.querySelectorAll('#btnDiv > button')[1].innerHTML = 'Pause';
            isRun = true;
            TimeOut();
        }
    }
    function doStart(){
        tick=0;
    }


    function lyricDownload(){
        var filename = file.split('/').pop()+'.txt';
        iss.download(filename);
    }

    window.addEventListener("scroll", function(e){
        //console.log(scrollX)
        listDiv.style.left = 8-scrollX + 'px';
        console.log(pageDiv.offsetLeft)
    });

    window.addEventListener("load", function(e){
        //file = encodeURIComponent(url)||'050.ISS';
        file = url||'050.ISS';
        //var file = 'BB-COOL.ISS';
        //var file = 'CLUB.ISS';
        //var file = 'CLASSIC2.ISS';
        //var file = 'BEST6027.ISS';
        //var file = 'COM-DEU3.ISS';
        console.log('file',file);

        Ajax({url:escape(file),type:'arraybuffer'
             ,callback:(xhr)=>{
                iss=ISS(xhr.response);
                console.log('songheader', iss.header);
                pageDiv.innerHTML = '<pre role="img" aria-label="ASCII COW">'+iss.lyric.join('\n')+'</pre>';
                issView = iss.viewLyric('#listDiv');
             }
        });
    });

    function viewLyric(){
        //issView.play();
        doRun();
    }

  </script>
</head>
<body>
<div id=listDiv><pre>&nbsp;</pre></div>
<div id=listDivFix style="height:43px;"><pre><br/> &nbsp;</pre></div>
<div id=btnDiv><button onclick="lyricDownload()">Download</button><button onclick="viewLyric()">ViewLyric</button></div>
<div id=pageDiv></div>
<div id=debug></div>
</body>
</html>
