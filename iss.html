var idx = 0;  // iss 읽기 위치 - 출력용(디버깅용)
    //var Headerfunction 
    var isErr = false;
    var getByte = (()=>{ // iss byte 읽기 - 한글인경우 변환처리 함
        var position = 0; // 버퍼의 읽기 위치 - 읽을때 마다 읽은 바이트만큼 증가함.
        return (length, type)=>{
            var start = position; // 읽기 시작위치
            position += length;   // 읽을 byte 수
            idx=position;         // 읽기 위치 저장 - 디버깅용
            type=type||'';        // 읽을 byte type
            if(type=='int8'){     // 8bit 정수
                return uInt8Array[start];
            } else if(type=='int16'){ // 16비트 정수
                return uInt8Array[position-1]<<8|uInt8Array[start];
            } else {
                returnVal='';
                isErr = false;
                for(var i=0; i<length; i++){
                    var h = uInt8Array[ start+i   ];
                    //console.log(h)
                    if(h == 0x00) break; // 쓰레기값이 출력되서 EOF?처리함
                    var l = '';
                    if(uInt8Array.length > start+i+1) l = uInt8Array[ start+i+1 ];

                    if(h & 0x80) {
                        if (l == 0x00) {// continue;	/* 하위 바이트 ERROR */
                            returnVal += '[]';
                            continue;
                        }

                        var ch = ((h << 8) & 0xff00) + (l & 0xff);
                        if (ch >= 0x8861 && ch <= 0xd3b7) {	/* '가'부터 '힝'까지 2,350자 */
                            returnVal+=KSSMCODE[ch] || '';
                        } else if (ch >= 0xd931 && ch <= 0xdef1) {	/* 조합형 symbol */
                            if(!KSSMCODE[ch]){
                                isErr = true;
                                console.log('❔', ch.toString(16), KSSMCODE[ch]);
                            }
                            //returnVal+='MM';
                            returnVal+=KSSMCODE[ch] || `<label title="${ch.toString(16)}">❔</label>`;
                        } else {	/* 초성 'ㄱ', 종성 자음, 모음 */
                            if(!KSSMCODE[ch]){
                                isErr = true;
                                console.log('❓', ch.toString(16), KSSMCODE[ch]);
                            }
                            //returnVal+='HH';
                            returnVal+=KSSMCODE[ch] || '❓';
                        }
                        i++;
                    } else {
                        returnVal += String.fromCharCode(uInt8Array[start+i]).replace(/\x00/g,'');
//                        returnVal += String.fromCharCode(uInt8Array[start+i]);
                    }
                }
                //if(length==64) 
                //if(length>2) 
                //console.log(returnVal);
                return returnVal;
            }
        }
    })();

String.prototype.putLyrics = function(pos){
    var tmp = '';    // 반환할 문자열
    var start_i;     // 자를 시작위치(하이라이트 시작위치)
    var width_i=0;   // 자를 너비(하이라이트 표시할 너비{글자수})
    var posIdx = 0;  // 다음출력 pos 위치
    for(b=i=0;c=this.charCodeAt(i);) { // 문자 단위 진행 (b는 byte i는 문자)
        var isNotAscii = c>>7;         // 127 보다 크면 한글
        b+=isNotAscii?2:1;             // 한글이면 2byte count
        //if (b > maxByte) break;
//        log('b',b,'i',i,pos[posIdx].start_x,pos[posIdx].width_x,this.charAt(i));
//        log('b',b,'i',i,pos[posIdx].start_x,pos[posIdx].width_x,this.charAt(i),b==pos[posIdx].start_x);
        if(b==pos[posIdx].start_x) {
            if(!posIdx) tmp = this.slice(0,i+1);
            else        tmp += this.slice(start_i,i+1);
            start_i = i+1; // 다음문자

            if(posIdx){
                // 이전줄보다 시작지점이 작으면(역방향)
                if(pos[posIdx].start_x < pos[posIdx-1].start_x){
                    start_i = i; // 현재위치
                    tmp = this.slice(0, i);
                }
            }
            //console.log('i['+i+'] b['+b+'] ch['+this.charAt(i)+'] posIdx['+posIdx+']','start_x',pos[posIdx].start_x, 'start_i', start_i, tmp)
            /**/
            //log('start', b, pos[posIdx].start_x+width_i, 'posIdx', posIdx, pos.length, pos[posIdx]);
        }
        if(b==(pos[posIdx].start_x+pos[posIdx].width_x)){
            //log('start_i',start_i,'i',i,this.charAt(i));
            //console.log('slice',start_i,i+1,this.slice(start_i,i+1));
            //if(posIdx) tmp+= this.slice(start_i,pos[posIdx].start_x-1);
            //tmp+= '<span>'+this.slice(pos[posIdx].start_x,i+1)+'</span>'
            tmp+= '<span>'+this.slice(start_i,i+1)+'</span>'
            //log('end', 'posIdx', posIdx, start_i, i+1, pos.length, pos[posIdx]);
            //width_i = i;
            width_i = pos[posIdx].width_x;
            start_i = i+1;
            posIdx++;
            if(posIdx == pos.length){
                //log('끝', 'posIdx', posIdx, i+1, this.slice(i+1,this.length));
                tmp+=this.slice(i+1,this.length);
                break;
            }
            // 이전줄보다 시작지점이 작으면(역방향)
            if(pos[posIdx].start_x < pos[posIdx-1].start_x){
                // 처음부터 다시 시작
                i=-1; // 아래에서 +1 하므로 -1 하였음.
                b=0;
            }
        }
        i++;
    }
    return tmp;
}
