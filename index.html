console.logCopy = console.log.bind(console);

console.log = function()
{
    // Timestamp to prepend
    var timestamp = new Date().toJSON();
    //var timestamp = new Date().toISOString();

    if (arguments.length)
    {
        // True array copy so we can call .splice()
        var args = Array.prototype.slice.call(arguments, 0);

        // If there is a format string then... it must
        // be a string
        if (typeof arguments[0] === "string")
        {
            // Prepend timestamp to the (possibly format) string
            args[0] = "%o: " + arguments[0];

            // Insert the timestamp where it has to be
            args.splice(1, 0, timestamp);

            // Log the whole array
            this.logCopy.apply(this, args);
        }
        else
        {
            // "Normal" log
            this.logCopy(timestamp, args);
        }
    }
};
    function log() {
        console.log.apply(console, arguments);
    }
/*

var idx = 0;
    //var Headerfunction 
    var getByte = (()=>{
        var position = 0;
        return (length, type)=>{
            var start = position;
            position += length;
            idx=position;
            type=type||'';
            if(type=='int8'){
                return uInt8Array[start];
            } else if(type=='int16'){
                return uInt8Array[position-1]<<8|uInt8Array[start];
            } else {
                returnVal='';
                for(var i=0; i<length; i++){
                    var h = uInt8Array[ start+i   ];
                    //console.log(h)
                    if(h == 0x00) break; // 쓰레기값이 출력되서 EOF?처리함
                    var l = '';
                    if(uInt8Array.length > start+i+1) l = uInt8Array[ start+i+1 ];

                    if(h & 0x80) {
                        if (l == 0x00) {// continue;	/* 하위 바이트 ERROR */
                            returnVal += '[]';
                            continue;
                        }

                        var ch = ((h << 8) & 0xff00) + (l & 0xff);
                        if (ch >= 0x8861 && ch <= 0xd3b7) {	/* '가'부터 '힝'까지 2,350자 */
                            returnVal+=KSSMCODE[ch] || '';
                        } else if (ch >= 0xd931 && ch <= 0xdef1) {	/* 조합형 symbol */
                            if(!KSSMCODE[ch]) console.log('MM', h, l, ch, ch.toString(16), KSSMCODE[ch]);
                            //returnVal+='MM';
                            returnVal+=KSSMCODE[ch] || 'MM';
                        } else {	/* 초성 'ㄱ', 종성 자음, 모음 */
                            if(!KSSMCODE[ch]) console.log('HH', h, l, ch, ch.toString(16), KSSMCODE[ch]);
                            //returnVal+='HH';
                            returnVal+=KSSMCODE[ch] || 'HH';
                        }
                        i++;
                    } else {
                        returnVal += String.fromCharCode(uInt8Array[start+i]).replace(/\x00/g,'');
//                        returnVal += String.fromCharCode(uInt8Array[start+i]);
                    }
                }
                //if(length==64) 
                //if(length>2) 
                //console.log(returnVal);
                return returnVal;
            }
        }
    })();

    // 해더
    function SongHeader(){
        return {
            head_str   : getByte(20         )   // 25 char
           ,reserved   : getByte(10         )   // 25 char
           ,writer     : getByte(30         )   // 25 char
           ,composer   : getByte(30         )   // 25 char
           ,singer     : getByte(30         )   // 25 char
           ,editor     : getByte(30         )   // 25 char
           ,rec_count  : getByte(2 , 'int16')   // int
           ,line_count : getByte(2 , 'int16')   // int
        };
    }

    // 가사 출력관련 개체
    function SongRec(){
        return {
            kasa_tick : getByte(2, 'int16') // int
           ,line      : getByte(1, 'int8') //char
           ,start_x   : getByte(1, 'int8') //char
           ,width_x   : getByte(1, 'int8') //char
        }
    }

    function download(filename, text) {
        var element = document.createElement('a');
        //  element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
        element.setAttribute('href', 'data:text/plain;charset=utf-8,' + text);
        element.setAttribute('download', filename);

        element.style.display = 'none';
        document.body.appendChild(element);

        element.click();

        document.body.removeChild(element);
    }
